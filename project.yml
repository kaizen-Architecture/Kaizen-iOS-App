name: Kaizen
options:
  bundleIdPrefix: io.kaizen
  developmentLanguage: es
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
targets:
  Kaizen:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Sources/KaizenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kaizen.manga
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KaizenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KaizenKitTests
    dependencies:
      - target: Kaizen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kaizen.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  Kaizen:
    build:
      targets:
        Kaizen: all
    test:
      targets:
        - KaizenTests
