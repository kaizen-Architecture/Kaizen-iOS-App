name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Package Kaizen iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release App for iOS Device (arm64)
        run: |
          xcodebuild clean build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos

      - name: Package IPA for AltStore
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Kaizen.app Payload/
          zip -r Kaizen.ipa Payload
          echo "Kaizen.ipa packaged successfully."

      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-iPadOS-iOS-IPA
          path: Kaizen.ipa
          retention-days: 14
