name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Kaizen iOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Toolchain Info
        run: |
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator (Smoke Test)
        run: |
          xcodebuild clean build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  package-ipa:
    name: Package IPA for AltStore / Sideloading
    needs: build-and-test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive and Export IPA
        run: |
          set -e
          echo "Compilando archivo nativo para dispositivo iOS (arm64)..."
          
          # 1. Compilar para iOS Device sin firma restrictiva (para permitir AltStore / Sideloadly)
          xcodebuild clean build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos

          # 2. Empaquetar en estructura Payload estándar de iOS
          mkdir -p Payload
          cp -r build/Release-iphoneos/Kaizen.app Payload/
          
          # 3. Comprimir en archivo IPA
          zip -r Kaizen.ipa Payload
          echo "Kaizen.ipa generado exitosamente."

      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-iPadOS-iOS-IPA
          path: Kaizen.ipa
          retention-days: 14
