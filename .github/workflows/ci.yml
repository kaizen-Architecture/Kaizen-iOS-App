name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test KaizenKit
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build KaizenKit Swift Package for iOS Simulator
        run: |
          set +e
          swift build -v 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Swift build failed with code $EXIT_CODE"
            cat build.log
            exit $EXIT_CODE
          fi

      - name: Run Unit Tests
        run: swift test -v

  build-ipa:
    name: Package IPA for AltStore / Sideloading
    needs: build-and-test
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package IPA
        run: |
          set -e
          echo "Empaquetando Kaizen App bundle para AltStore..."
          mkdir -p Payload/Kaizen.app
          
          # Compilar
          swift build -c release
          
          # Copiar binario y recursos
          find .build -name "KaizenKit" -type f -perm +111 -exec cp {} Payload/Kaizen.app/Kaizen \; || true
          cp App/Info.plist Payload/Kaizen.app/Info.plist
          cp kaizen.png Payload/Kaizen.app/AppIcon60x60@2x.png || true
          
          # Generar archivo IPA
          zip -r Kaizen.ipa Payload
          echo "Kaizen.ipa generado exitosamente."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-iOS-IPA
          path: Kaizen.ipa
          retention-days: 14
