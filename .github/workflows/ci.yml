name: CI & Build Kaizen iOS

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test KaizenKit
    runs-on: macos-14 # macOS runner con Xcode moderno de Apple
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build KaizenKit Swift Package
        run: swift build -v

      - name: Run Unit Tests (Swift Testing)
        run: swift test -v
