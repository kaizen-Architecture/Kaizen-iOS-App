name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Package Kaizen iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          else
            echo "Using default Xcode"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Check project format
        run: grep objectVersion Kaizen.xcodeproj/project.pbxproj

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.2" \
            CODE_SIGNING_ALLOWED=NO || \
          xcodebuild test \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release App for iOS Device (arm64)
        run: |
          xcodebuild clean build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos

      - name: Package IPA for AltStore
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist 2>/dev/null || echo "1.1.0")
          echo "Packaging version: $VERSION"
          mkdir -p Payload
          cp -r build/Release-iphoneos/Kaizen.app Payload/
          zip -r "Kaizen_v${VERSION}.ipa" Payload
          cp "Kaizen_v${VERSION}.ipa" Kaizen.ipa
          echo "Kaizen_v${VERSION}.ipa and Kaizen.ipa packaged successfully."

      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-v1.1.0-IPA
          path: |
            Kaizen_v*.ipa
            Kaizen.ipa
          retention-days: 14
