name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Package Kaizen iOS IPA
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_26" ]; then
            echo "Selecting $XCODE_26"
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          else
            echo "Using default Xcode on macos-26"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Check project format
        run: grep objectVersion Kaizen.xcodeproj/project.pbxproj

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          xcodebuild test \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Inject Build Number
        run: |
          BUILD_NUM="${{ github.run_number }}"
          BASE_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist 2>/dev/null || echo "1.2.0")
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          echo "BASE_VER=$BASE_VER" >> $GITHUB_ENV
          echo "Setting CFBundleVersion to $BUILD_NUM in App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" App/Info.plist

      - name: Build Release App for iOS Device (arm64)
        run: |
          xcodebuild clean build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CONFIGURATION_BUILD_DIR=$PWD/build/Release-iphoneos

      - name: Package IPA for AltStore (Staging vs Final)
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Kaizen.app Payload/
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "CHANNEL=final" >> $GITHUB_ENV
            echo "Packaging FINAL version: ${BASE_VER} (Build ${BUILD_NUM})"
            zip -r "Kaizen_v${BASE_VER}_b${BUILD_NUM}.ipa" Payload
            cp "Kaizen_v${BASE_VER}_b${BUILD_NUM}.ipa" Kaizen.ipa
          else
            echo "CHANNEL=staging" >> $GITHUB_ENV
            echo "Packaging STAGING/PRERELEASE version: ${BASE_VER} (Build ${BUILD_NUM})"
            zip -r "Kaizen_Staging_v${BASE_VER}_b${BUILD_NUM}.ipa" Payload
            cp "Kaizen_Staging_v${BASE_VER}_b${BUILD_NUM}.ipa" Kaizen_Staging.ipa
          fi

      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-${{ env.CHANNEL }}-v${{ env.BASE_VER }}-b${{ env.BUILD_NUM }}-IPA
          path: |
            Kaizen*.ipa
          retention-days: 14

      - name: Publish Final Release (main / v* tags)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: 🚀 Kaizen iOS Final v${{ env.BASE_VER }} (Build ${{ env.BUILD_NUM }})
          prerelease: false
          generate_release_notes: true
          files: |
            Kaizen_v*.ipa
            Kaizen.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Staging / Prerelease (feat/** & fix/** branches)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          target_commitish: ${{ github.sha }}
          name: 🧪 Kaizen iOS Staging v${{ env.BASE_VER }} (Build ${{ env.BUILD_NUM }} · ${{ github.ref_name }})
          prerelease: true
          generate_release_notes: true
          files: |
            Kaizen_Staging_v*.ipa
            Kaizen_Staging.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
