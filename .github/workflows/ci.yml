name: CI & Build Kaizen iOS (Release IPA)

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Kaizen iOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Toolchain Info
        run: |
          xcodebuild -version
          swift --version

      - name: Inspect schemes and destinations
        run: |
          xcodebuild -project Kaizen.xcodeproj -list
          xcodebuild -project Kaizen.xcodeproj -showdestinations -scheme Kaizen || true

      - name: Build for iOS Simulator (Smoke Test)
        run: |
          xcodebuild build \
            -project Kaizen.xcodeproj \
            -scheme Kaizen \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log || (echo "=== LOG COMPLETO DE XCODEBUILD ===" && cat xcodebuild.log && exit 1)
